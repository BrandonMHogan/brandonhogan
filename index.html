<!doctype html>
<html lang="en">
  <head>
    <title>Brandon Hogan · Software Engineer</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Brandon Hogan is a mobile, web, and API software engineer—and caretaker of a very small kingdom." />
    <link rel="icon" type="image/jpeg" href="/profile-icon.jpg" />
    <link rel="apple-touch-icon" href="/profile-icon.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&amp;family=Source+Sans+3:wght@300;400;600&amp;display=swap" rel="stylesheet" />
  </head>
  <body>
    <main class="kingdom-shell">
      <div id="game" class="game" aria-label="An animated fantasy kingdom"></div>
      <header class="profile">
        <button class="portrait" type="button" aria-label="Spin Brandon's photo"><img src="/images/me.jpg" alt="Brandon Hogan" /></button>
        <h1>Hello, I’m <strong>Brandon Hogan</strong>.</h1>
        <p>I make mobile apps, websites, APIs—and, apparently,<br />tiny kingdoms where everyone clocks off at sunset.</p>
        <nav aria-label="Find Brandon online">
          <a href="https://github.com/BrandonMHogan">GitHub</a>
          <a href="https://www.linkedin.com/in/brandonmhogan">LinkedIn</a>
          <a href="mailto:brandon.michael.hogan@gmail.com">Email</a>
        </nav>
      </header>

      <section id="controls" class="world-controls" aria-label="Kingdom controls"></section>

      <section class="hud" aria-label="Kingdom resources">
        <span title="Food">🌾 <b id="food">0</b></span>
        <span title="Wood">🪵 <b id="wood">0</b></span>
        <span title="Stone">🪨 <b id="stone">0</b></span>
        <span title="Villagers">👤 <b id="population">0</b></span>
        <span class="phase"><i id="phase-icon">☀️</i> <b id="phase">Day</b></span>
        <button id="reset" type="button">Reset</button>
      </section>
      <p id="status" class="sr-only" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
