<!doctype html>
<html lang="en">
  <head>
    <title>Brandon Hogan</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>

  <body>
    <div id="wrapper">
      <main id="main">
        <header id="header">
          <div class="avatar">
            <img src="images/me.jpg" alt="Brandon Hogan" />
          </div>
          <ul class="icons">
            <li>
              <a
                href="https://github.com/BrandonMHogan"
                class="icon style2 fa-github"
                aria-label="GitHub"
              >
                <span class="label">GitHub</span>
              </a>
            </li>
            <li>
              <a
                href="https://www.linkedin.com/in/brandonmhogan"
                class="icon style2 fa-linkedin"
                aria-label="LinkedIn"
              >
                <span class="label">LinkedIn</span>
              </a>
            </li>
            <li>
              <a
                href="https://www.instagram.com/brandon.m.hogan/"
                class="icon style2 fa-instagram"
                aria-label="Instagram"
              >
                <span class="label">Instagram</span>
              </a>
            </li>
            <li>
              <a
                href="mailto:me@brandonhogan.com"
                class="icon style2 fa-envelope-o"
                aria-label="Email"
              >
                <span class="label">Email</span>
              </a>
            </li>
          </ul>
          <h1>
            Hello, I'm <strong>Brandon Hogan</strong>. A mobile, web, and API
            software engineer.<br />I also dabble in just about everything
            else.
          </h1>
        </header>
      </main>

      <footer id="footer">
        <p>&copy; brandon hogan. All rights reserved.</p>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
